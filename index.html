<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ARENA – 2D Top-Down Multiplayer Shooter</title>
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="data:,">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="2D Top-Down Multiplayer Shooter mit Echtzeit-Multiplayer (Supabase) und Touch-Steuerung.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --panel: #18181b;
      --panel2: #27272a;
      --line: #3f3f46;
      --line-soft: #27272a;
      --txt: #fafafa;
      --dim: #a1a1aa;
      --acc: #ffd54a;
      --blue: #60a5fa;
      --red: #f87171;
      --green: #4ade80;
      --sa-t: env(safe-area-inset-top, 0px);
      --sa-b: env(safe-area-inset-bottom, 0px);
      --sa-l: env(safe-area-inset-left, 0px);
      --sa-r: env(safe-area-inset-right, 0px);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; touch-action: manipulation; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #c {
      position: fixed; inset: 0;
      touch-action: none;
      display: block;
      z-index: 1;
    }
    .hidden { display: none !important; }
    :focus-visible { outline: 2px solid var(--txt); outline-offset: 2px; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed; inset: 0;
      z-index: 10; pointer-events: none;
      padding: calc(8px + var(--sa-t)) calc(10px + var(--sa-r)) calc(8px + var(--sa-b)) calc(10px + var(--sa-l));
    }
    #hpWrap {
      position: absolute; top: calc(10px + var(--sa-t)); left: calc(10px + var(--sa-l));
      width: 186px;
    }
    #hpBar {
      position: relative; height: 16px;
      background: rgba(9,9,11,.72);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    #hpFill {
      position: absolute; inset: 0 auto 0 0;
      width: 100%;
      background: #22c55e;
      transition: width .12s linear;
    }
    #hpText {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 10px; font-variant-numeric: tabular-nums;
      color: #052e16;
    }
    #shWrap {
      position: relative; height: 5px; margin-top: 3px;
      background: rgba(9,9,11,.72);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    #shFill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--blue); }
    #buffs {
      margin-top: 5px; font-size: 11px; font-weight: 600;
      color: var(--blue);
      min-height: 14px;
    }

    #kd {
      position: absolute; top: calc(10px + var(--sa-t)); left: calc(10px + var(--sa-l));
      margin-top: 54px;
      font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
      letter-spacing: .04em; color: var(--dim);
    }

    #killfeed {
      position: absolute;
      top: calc(178px + var(--sa-t)); right: calc(12px + var(--sa-r));
      width: 230px; text-align: right;
      display: flex; flex-direction: column; gap: 4px;
      overflow: hidden;
    }
    .kf {
      font-size: 11px; font-weight: 600; color: #e4e4e7;
      background: rgba(9,9,11,.78);
      border: 1px solid var(--line-soft);
      padding: 3px 8px;
      display: inline-block; align-self: flex-end;
      animation: kfin .18s ease-out;
    }
    @keyframes kfin { from { transform: translateX(30px); opacity: 0; } }

    #weapons {
      position: absolute; bottom: calc(12px + var(--sa-b)); left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
      pointer-events: auto;
    }
    .wchip {
      width: 68px; height: 52px;
      background: rgba(9,9,11,.8);
      border: 1px solid var(--line);
      color: var(--txt);
      font: inherit; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px;
      position: relative;
      transition: border-color .1s, background-color .1s;
    }
    .wchip:active { transform: scale(.97); }
    .wchip .key { position: absolute; top: 4px; left: 6px; font-size: 10px; color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
    .wchip .wname { font-size: 10px; font-weight: 700; }
    .wchip .ammo { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
    .wchip.sel {
      border-color: var(--acc);
      background: rgba(255,213,74,.1);
    }
    .wchip.locked { opacity: .35; }
    .wchip.reloading .ammo { color: var(--acc); }
    .wchip.reloading .rbar {
      position: absolute; left: 0; bottom: 0; height: 3px;
      background: var(--acc);
      transition: none;
    }
    .wchip.flashing { border-color: var(--green); background: rgba(74,222,128,.12); animation: chipflash .1s ease-out; }
    @keyframes chipflash { 0% { transform: scale(1); } 50% { transform: scale(1.06); } }

    #topBtns {
      position: absolute; top: calc(10px + var(--sa-t)); right: calc(12px + var(--sa-r));
      display: flex; gap: 6px; pointer-events: auto;
    }
    .pill {
      background: rgba(9,9,11,.78);
      border: 1px solid var(--line);
      color: #e4e4e7;
      font: inherit; font-size: 11px; font-weight: 600;
      padding: 6px 10px; cursor: pointer;
      transition: border-color .1s, color .1s;
    }
    .pill:hover { border-color: var(--dim); color: var(--txt); }
    .pill:active { transform: scale(.97); }
    .pill.off { color: var(--dim); text-decoration: line-through; }

    #dead {
      position: absolute; bottom: 26%; left: 50%;
      transform: translateX(-50%);
      background: rgba(9,9,11,.92);
      border: 1px solid #b91c1c;
      color: #fca5a5;
      padding: 8px 16px;
      font-weight: 700; font-size: 14px;
      text-align: center; white-space: nowrap;
    }

    #notice {
      position: fixed; top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20; pointer-events: none;
      font-size: clamp(15px, 3vw, 20px); font-weight: 800;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
      text-align: center; white-space: nowrap;
      transition: opacity .35s;
    }
    #notice.hide { opacity: 0; }

    /* ---------- Scoreboard ---------- */
    #board {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      width: min(440px, 92vw);
      background: var(--panel);
      border: 1px solid var(--line-soft);
      padding: 16px;
    }
    .board-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .board-head b {
      font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--dim);
    }
    .board-head button {
      background: none; border: 1px solid var(--line); color: var(--dim);
      font: inherit; font-size: 10px; font-weight: 600;
      padding: 4px 8px; cursor: pointer;
    }
    .board-head button:hover { color: var(--txt); border-color: var(--dim); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 0; text-align: left; }
    th {
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      font-weight: 600;
      color: var(--dim);
    }
    th, td { border-bottom: 1px solid var(--line-soft); }
    tr.me td { background: rgba(255,213,74,.07); font-weight: 600; }
    tr.out td { opacity: .45; }

    /* ---------- Overlays ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(9,9,11,.93);
      display: flex; align-items: center; justify-content: center;
      padding: calc(14px + var(--sa-t)) calc(14px + var(--sa-r)) calc(14px + var(--sa-b)) calc(14px + var(--sa-l));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .panel {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--line-soft);
      padding: 28px;
      margin: auto;
    }
    .panel.narrow { width: min(360px, 100%); }
    .title {
      font-size: 30px;
      font-weight: 800; letter-spacing: -.02em;
      text-align: left;
      color: var(--txt);
      line-height: 1.1;
    }
    .subtitle {
      color: var(--dim);
      font-size: 13px; margin-top: 4px;
    }
    .net-line {
      font-size: 11px; margin-top: 14px;
      color: var(--dim);
      display: flex; align-items: center; gap: 6px;
    }
    .net-line span { color: var(--green); font-weight: 600; }
    .net-line span.err { color: var(--red); }

    .lbl {
      display: block; font-size: 11px; font-weight: 600;
      text-transform: uppercase;
      color: var(--dim); margin: 22px 0 6px;
    }
    .inp {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--txt);
      font: inherit; font-size: 15px;
      padding: 10px 12px;
      transition: border-color .1s;
      -webkit-user-select: text; user-select: text;
    }
    .inp:focus { outline: none; border-color: var(--dim); }
    .inp:focus-visible { outline: 2px solid var(--txt); outline-offset: 1px; }

    .btn {
      background: var(--acc); color: #1c1917;
      border: 1px solid transparent;
      font: inherit; font-weight: 700; font-size: 15px;
      padding: 11px 18px; cursor: pointer;
      transition: filter .1s;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: scale(.99); }
    .btn:disabled { opacity: .4; cursor: default; }

    #btnStart { width: 100%; margin-top: 16px; font-size: 16px; padding: 13px; }

    .controls {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px;
      font-size: 12px; color: var(--dim); line-height: 1.5;
      margin-top: 22px;
      border-top: 1px solid var(--line-soft);
      padding-top: 14px;
    }
    .controls b { color: var(--txt); font-weight: 600; }
    kbd {
      background: var(--bg); border: 1px solid var(--line);
      border-bottom-width: 2px;
      padding: 0 5px; font-size: 10.5px; font-family: inherit; font-weight: 600;
      color: var(--txt);
    }

    #loading {
      position: fixed; inset: 0; z-index: 99;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim);
    }
    noscript { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
  </style>
</head>
<body>

  <canvas id="c"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="hpWrap">
      <div id="hpBar"><div id="hpFill"></div><div id="hpText">100</div></div>
      <div id="shWrap" class="hidden"><div id="shFill"></div></div>
      <div id="buffs"></div>
    </div>
    <div id="kd">K 0 · D 0</div>

    <div id="topBtns">
      <button id="btnBoard" class="pill">Tabelle</button>
      <button id="btnMute" class="pill">Ton: an</button>
    </div>

    <div id="killfeed"></div>
    <div id="dead" class="hidden"></div>

    <div id="weapons"></div>
  </div>

  <div id="notice" class="hide"></div>

  <!-- Scoreboard -->
  <div id="board" class="hidden">
    <div class="board-head">
      <b>Tabelle</b>
      <button id="btnBoardClose">Schliessen</button>
    </div>
    <div id="boardBody"></div>
  </div>

  <!-- Start -->
  <div id="lobby" class="overlay">
    <div class="panel narrow">
      <div class="title">ARENA</div>
      <div class="subtitle">2D Top-Down Multiplayer Shooter</div>
      <div class="net-line">Status: <span id="netStatus">Verbinde …</span></div>

      <label class="lbl" for="nameIn">Name</label>
      <input id="nameIn" class="inp" maxlength="14" autocomplete="off" spellcheck="false">

      <button id="btnStart" class="btn">Spielen</button>

      <div class="controls">
        <span><b>Bewegen:</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
        <span><b>Schiessen:</b> <kbd>Leertaste</kbd> / Klick</span>
        <span><b>Zielen:</b> Maus, <b>Nachladen:</b> <kbd>R</kbd></span>
        <span><b>Waffe:</b> <kbd>1</kbd>-<kbd>2</kbd></span>
        <span><b>Touch:</b> Sticks bewegen / zielen</span>
        <span><b>Tab:</b> Tabelle</span>
      </div>
    </div>
  </div>

  <div id="loading"></div>
  <noscript>Dieses Spiel benötigt JavaScript.</noscript>

  <script src="js/config.js"></script>
  <script src="js/world.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/net.js"></script>
  <script src="js/input.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script>Game.init();</script>
</body>
</html>
