<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2D Top-Down Shooter</title>
  <!-- Supabase JS Library (UMD Bundle für globale window.supabase Variable) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
    canvas { display: block; background: #222; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
    #status { font-weight: bold; color: #ffcc00; }
  </style>
</head>
<body>

  <div id="ui">
    <h1>2D Top-Down Shooter</h1>
    <p>Status: <span id="status">Verbinde...</span></p>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const statusEl = document.getElementById('status');

    // 1. SUPABASE PROFIL & INITIALISIERUNG// Correct Project Setup from your Screenshot
<script>
    const statusEl = document.getElementById('status');

    // 1. SUPABASE PROFIL & INITIALISIERUNG
    const SUPABASE_URL = 'https://hnuilozoehvmosgumrsc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhudWlsb3pvZWh2bW9zZ3VtcnNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzY3NTEsImV4cCI6MjEwNjg1Mjc1MX0.ztp_BEa420xSujbBCWLz1QHLOL4YDHE-jWQmP8ucTBo';

    if (!window.supabase) {
      statusEl.innerText = 'Fehler: Supabase SDK nicht geladen!';
      statusEl.style.color = 'red';
      throw new Error('Supabase SDK missing');
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. CANVAS SETUP
    // ... restlicher Code bleibt genau so wie bei dir!

    // 2. CANVAS SETUP
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Player State
    const myId = 'player_' + Math.random().toString(36).substr(2, 9);
    let player = {
      id: myId,
      x: Math.random() * (canvas.width - 100) + 50,
      y: Math.random() * (canvas.height - 100) + 50,
      angle: 0,
      color: '#' + Math.floor(Math.random()*16777215).toString(16),
      hp: 100
    };

    let otherPlayers = {};
    let bullets = [];

    // 3. TOUCH / STEUERUNG
    let touchStartPos = null;
    
    canvas.addEventListener('pointerdown', (e) => {
      if (e.clientX > canvas.width / 2) {
        shootBullet(e.clientX, e.clientY);
      } else {
        touchStartPos = { x: e.clientX, y: e.clientY };
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (touchStartPos && e.buttons > 0) {
        const dx = e.clientX - touchStartPos.x;
        const dy = e.clientY - touchStartPos.y;
        player.x += dx * 0.05;
        player.y += dy * 0.05;
        player.angle = Math.atan2(dy, dx);
        broadcastPosition();
      }
    });

    canvas.addEventListener('pointerup', () => { touchStartPos = null; });

    // 4. SUPABASE REALTIME SYNC MIT ERROR-HANDLING
    const channel = sb.channel('arena_room_1');

    channel
      .on('broadcast', { event: 'player-move' }, ({ payload }) => {
        if (payload.id !== myId) {
          otherPlayers[payload.id] = payload;
        }
      })
      .on('broadcast', { event: 'shoot' }, ({ payload }) => {
        if (payload.shooterId !== myId) {
          bullets.push(payload);
        }
      })
      .subscribe((status, err) => {
        statusEl.innerText = status;
        
        if (status === 'SUBSCRIBED') {
          statusEl.style.color = '#00ff00';
          statusEl.innerText = 'Verbunden! ID: ' + myId;
          broadcastPosition();
        } else if (status === 'CHANNEL_ERROR') {
          statusEl.style.color = 'red';
          statusEl.innerText = 'CHANNEL_ERROR: Prüfe Realtime im Supabase Dashboard';
          console.error('Channel error details:', err);
        } else if (status === 'TIMED_OUT') {
          statusEl.style.color = 'orange';
          statusEl.innerText = 'TIMED_OUT: Verbindungssignal verloren';
        }
      });

    function broadcastPosition() {
      channel.send({
        type: 'broadcast',
        event: 'player-move',
        payload: player
      });
    }

    function shootBullet(targetX, targetY) {
      const angle = Math.atan2(targetY - player.y, targetX - player.x);
      const bullet = {
        id: Math.random(),
        shooterId: myId,
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * 12,
        vy: Math.sin(angle) * 12
      };
      bullets.push(bullet);

      channel.send({
        type: 'broadcast',
        event: 'shoot',
        payload: bullet
      });
    }

    // 5. GAME LOOP
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      bullets.forEach((b, i) => {
        b.x += b.vx;
        b.y += b.vy;
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();

        if (b.shooterId !== myId) {
          const dist = Math.hypot(b.x - player.x, b.y - player.y);
          if (dist < 20) {
            player.hp -= 10;
            bullets.splice(i, 1);
            if (player.hp <= 0) {
              alert('Du wurdest abgeschossen!');
              player.hp = 100;
              player.x = Math.random() * (canvas.width - 100) + 50;
              player.y = Math.random() * (canvas.height - 100) + 50;
            }
          }
        }
      });

      drawPlayer(player);
      Object.values(otherPlayers).forEach(drawPlayer);

      requestAnimationFrame(gameLoop);
    }

    function drawPlayer(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, -4, 25, 8);

      ctx.restore();

      ctx.fillStyle = 'red';
      ctx.fillRect(p.x - 20, p.y - 30, 40, 5);
      ctx.fillStyle = 'green';
      ctx.fillRect(p.x - 20, p.y - 30, (p.hp / 100) * 40, 5);
    }

    gameLoop();
  </script>
</body>
</html>
