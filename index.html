<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2D Top-Down Shooter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
    canvas { display: block; background: #222; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
    #status { font-weight: bold; color: #ffcc00; }
  </style>
</head>
<body>

  <div id="ui">
    <h1>2D Top-Down Shooter</h1>
    <p>Status: <span id="status">Verbinde...</span></p>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const statusEl = document.getElementById('status');

    // 1. SUPABASE INITIALISIERUNG
    const SUPABASE_URL = 'https://hnuilozoehvmosgumrsc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhudWlsb3pvZWh2bW9zZ3VtcnNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzY3NTEsImV4cCI6MjEwNjg1Mjc1MX0.ztp_BEa420xSujbBCWLz1QHLOL4YDHE-jWQmP8ucTBo';

    if (!window.supabase) {
      statusEl.innerText = 'Fehler: Supabase SDK nicht geladen!';
      statusEl.style.color = 'red';
      throw new Error('Supabase SDK missing');
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. CANVAS SETUP
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Player State
    const myId = 'player_' + Math.random().toString(36).substr(2, 9);
    let player = {
      id: myId,
      x: Math.random() * (canvas.width - 100) + 50,
      y: Math.random() * (canvas.height - 100) + 50,
      angle: 0,
      color: '#' + Math.floor(Math.random() * 16777215).toString(16),
      hp: 100
    };

    let otherPlayers = {};
    let bullets = [];
    const moveSpeed = 4;

    // Tastatur-Status (WASD)
    const keys = { w: false, a: false, s: false, d: false, space: false };
    let canShootWithSpace = true;

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
      if (e.code === 'Space') {
        if (canShootWithSpace) {
          shootInFacingDirection();
          canShootWithSpace = false;
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
      if (e.code === 'Space') canShootWithSpace = true;
    });

    // Touch / Pointer Steuerung
    let touchStartPos = null;
    let activePointerId = null;

    canvas.addEventListener('pointerdown', (e) => {
      // Rechte Bildschirmhälfte: Schießen in Richtung des Klicks
      if (e.clientX > canvas.width / 2) {
        shootAtTarget(e.clientX, e.clientY);
      } else {
        // Linke Bildschirmhälfte: Virtueller Joystick
        touchStartPos = { x: e.clientX, y: e.clientY };
        activePointerId = e.pointerId;
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (touchStartPos && e.pointerId === activePointerId) {
        const dx = e.clientX - touchStartPos.x;
        const dy = e.clientY - touchStartPos.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 5) {
          player.angle = Math.atan2(dy, dx);
          // Sanfte Bewegung basierend auf Joystick-Auslenkung
          const speedFactor = Math.min(dist / 40, 1) * moveSpeed;
          player.x += Math.cos(player.angle) * speedFactor;
          player.y += Math.sin(player.angle) * speedFactor;
        }
      } else if (!touchStartPos) {
        // Maus-Blickrichtung anpassen, wenn nicht gesteuert wird
        const dx = e.clientX - player.x;
        const dy = e.clientY - player.y;
        player.angle = Math.atan2(dy, dx);
      }
    });

    const stopTouch = (e) => {
      if (e.pointerId === activePointerId) {
        touchStartPos = null;
        activePointerId = null;
      }
    };
    canvas.addEventListener('pointerup', stopTouch);
    canvas.addEventListener('pointercancel', stopTouch);

    // 3. SUPABASE REALTIME CHANNEL & NETWORK THROTTLING
    const channel = sb.channel('arena_room_1', {
      config: { broadcast: { self: true } }
    });

    channel
      .on('broadcast', { event: 'player-move' }, ({ payload }) => {
        if (payload.id !== myId) {
          otherPlayers[payload.id] = payload;
        }
      })
      .on('broadcast', { event: 'shoot' }, ({ payload }) => {
        if (payload.shooterId !== myId) {
          bullets.push(payload);
        }
      })
      .subscribe((status, err) => {
        statusEl.innerText = status;
        if (status === 'SUBSCRIBED') {
          statusEl.style.color = '#00ff00';
          statusEl.innerText = 'Verbunden! ID: ' + myId;
        } else if (status === 'CHANNEL_ERROR') {
          statusEl.style.color = 'red';
          statusEl.innerText = 'CHANNEL_ERROR: Verbindung fehlgeschlagen';
          console.error('Channel Error:', err);
        }
      });

    // Rate-Limiting für Netzwerk-Sync (alle 50ms max. 20 Pakete/s)
    let lastBroadcastTime = 0;
    function broadcastPosition() {
      const now = Date.now();
      if (now - lastBroadcastTime > 50) {
        channel.send({
          type: 'broadcast',
          event: 'player-move',
          payload: player
        });
        lastBroadcastTime = now;
      }
    }

    // Schussfunktionen
    function shootAtTarget(targetX, targetY) {
      const angle = Math.atan2(targetY - player.y, targetX - player.x);
      player.angle = angle;
      createAndSendBullet(angle);
    }

    function shootInFacingDirection() {
      createAndSendBullet(player.angle);
    }

    function createAndSendBullet(angle) {
      const bullet = {
        id: Math.random().toString(36).substr(2, 9),
        shooterId: myId,
        x: player.x + Math.cos(angle) * 25,
        y: player.y + Math.sin(angle) * 25,
        vx: Math.cos(angle) * 12,
        vy: Math.sin(angle) * 12
      };
      bullets.push(bullet);

      channel.send({
        type: 'broadcast',
        event: 'shoot',
        payload: bullet
      });
    }

    // 4. GAME LOOP
    function gameLoop() {
      // WASD Bewegung verarbeiten
      let moveX = 0;
      let moveY = 0;

      if (keys.w) moveY -= 1;
      if (keys.s) moveY += 1;
      if (keys.a) moveX -= 1;
      if (keys.d) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        player.x += (moveX / len) * moveSpeed;
        player.y += (moveY / len) * moveSpeed;
        
        // Winkel an Bewegung ausrichten, falls kein Touch aktiv
        if (!touchStartPos) {
          player.angle = Math.atan2(moveY, moveX);
        }
      }

      // Grenzen einhalten
      player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
      player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

      // Position kontinuierlich senden
      broadcastPosition();

      // Rendering
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Bullets aktualisieren und zeichnen
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();

        // Kollision prüfen
        if (b.shooterId !== myId) {
          const dist = Math.hypot(b.x - player.x, b.y - player.y);
          if (dist < 20) {
            player.hp -= 10;
            bullets.splice(i, 1);
            if (player.hp <= 0) {
              alert('Du wurdest abgeschossen!');
              player.hp = 100;
              player.x = Math.random() * (canvas.width - 100) + 50;
              player.y = Math.random() * (canvas.height - 100) + 50;
            }
            continue;
          }
        }

        // Bullets außerhalb des Bildschirms löschen
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }

      // Spieler zeichnen
      drawPlayer(player);
      Object.values(otherPlayers).forEach(drawPlayer);

      requestAnimationFrame(gameLoop);
    }

    function drawPlayer(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      // Körper
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fill();

      // Kanonenrohr
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, -4, 25, 8);

      ctx.restore();

      // HP-Balken
      ctx.fillStyle = 'red';
      ctx.fillRect(p.x - 20, p.y - 30, 40, 5);
      ctx.fillStyle = 'green';
      ctx.fillRect(p.x - 20, p.y - 30, (p.hp / 100) * 40, 5);
    }

    gameLoop();
  </script>
</body>
</html>
