<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2D Top-Down Shooter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
    body { background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
    canvas { display: block; background: #222; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
    #status { font-weight: bold; color: #ffcc00; }
  </style>
</head>
<body>

  <div id="ui">
    <h1>2D Top-Down Shooter</h1>
    <p>Status: <span id="status">Verbinde...</span></p>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const statusEl = document.getElementById('status');

    // 1. SUPABASE INITIALISIERUNG
    const SUPABASE_URL = 'https://hnuilozoehvmosgumrsc.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhudWlsb3pvZWh2bW9zZ3VtcnNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzY3NTEsImV4cCI6MjEwNjg1Mjc1MX0.ztp_BEa420xSujbBCWLz1QHLOL4YDHE-jWQmP8ucTBo';

    if (!window.supabase) {
      statusEl.innerText = 'Fehler: Supabase SDK nicht geladen!';
      statusEl.style.color = 'red';
      throw new Error('Supabase SDK missing');
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. CANVAS SETUP
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Player State
    const MAX_HP = 300;
    const myId = 'player_' + Math.random().toString(36).substr(2, 9);
    let player = {
      id: myId,
      x: Math.random() * (canvas.width - 100) + 50,
      y: Math.random() * (canvas.height - 100) + 50,
      angle: 0,
      color: '#' + Math.floor(Math.random() * 16777215).toString(16),
      hp: MAX_HP
    };

    let otherPlayers = {};
    let bullets = [];
    const moveSpeed = 4;

    // Schuss-Einstellungen
    const FIRE_INTERVAL_MS = 150; 
    const DAMAGE_PER_HIT = 7;     
    let lastShotTime = 0;
    let isShooting = false;
    let aimTarget = { x: 0, y: 0 };

    // Tastatur-Status
    const keys = { w: false, a: false, s: false, d: false, space: false };

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
      if (e.code === 'Space') keys.space = true;
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
      if (e.code === 'Space') keys.space = false;
    });

    // Joystick & Touch
    let joystick = {
      active: false,
      startX: 0,
      startY: 0,
      currentX: 0,
      currentY: 0,
      maxRadius: 50
    };
    let activePointerId = null;
    let shootingPointerId = null;

    canvas.addEventListener('pointerdown', (e) => {
      const joystickZoneSize = 250;
      const isBottomLeft = (e.clientX < joystickZoneSize) && (e.clientY > canvas.height - joystickZoneSize);

      if (isBottomLeft) {
        joystick.active = true;
        joystick.startX = e.clientX;
        joystick.startY = e.clientY;
        joystick.currentX = e.clientX;
        joystick.currentY = e.clientY;
        activePointerId = e.pointerId;
      } else {
        isShooting = true;
        shootingPointerId = e.pointerId;
        aimTarget = { x: e.clientX, y: e.clientY };
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (joystick.active && e.pointerId === activePointerId) {
        joystick.currentX = e.clientX;
        joystick.currentY = e.clientY;

        const dx = joystick.currentX - joystick.startX;
        const dy = joystick.currentY - joystick.startY;
        const dist = Math.hypot(dx, dy);

        if (dist > 5) {
          player.angle = Math.atan2(dy, dx);
          const speedFactor = Math.min(dist / joystick.maxRadius, 1) * moveSpeed;
          player.x += Math.cos(player.angle) * speedFactor;
          player.y += Math.sin(player.angle) * speedFactor;
        }
      } else if (isShooting && e.pointerId === shootingPointerId) {
        aimTarget = { x: e.clientX, y: e.clientY };
      } else if (!joystick.active) {
        const dx = e.clientX - player.x;
        const dy = e.clientY - player.y;
        player.angle = Math.atan2(dy, dx);
      }
    });

    const stopInput = (e) => {
      if (e.pointerId === activePointerId) {
        joystick.active = false;
        activePointerId = null;
      }
      if (e.pointerId === shootingPointerId) {
        isShooting = false;
        shootingPointerId = null;
      }
    };
    canvas.addEventListener('pointerup', stopInput);
    canvas.addEventListener('pointercancel', stopInput);

    // 3. SUPABASE REALTIME & PRESENCE (Clean Cleanup & HP Sync)
    const channel = sb.channel('arena_room_1', {
      config: { 
        broadcast: { ack: false, self: false },
        presence: { key: myId }
      }
    });

    channel
      .on('broadcast', { event: 'player-move' }, (data) => {
        if (data.payload && data.payload.id !== myId) {
          // Position UND HP synchronisieren
          otherPlayers[data.payload.id] = data.payload;
        }
      })
      .on('broadcast', { event: 'shoot' }, (data) => {
        if (data.payload) {
          bullets.push(data.payload);
        }
      })
      .on('presence', { event: 'leave' }, ({ leftPresences }) => {
        // Tab geschlossen / Verbindung getrennt -> Spieler löschen
        leftPresences.forEach((p) => {
          delete otherPlayers[p.key];
        });
      })
      .subscribe((status, err) => {
        statusEl.innerText = status;
        if (status === 'SUBSCRIBED') {
          statusEl.style.color = '#00ff00';
          statusEl.innerText = 'Verbunden! ID: ' + myId;
          // Eigene Anwesenheit an den Server melden
          channel.track({ online_at: new Date().toISOString(), id: myId });
        } else {
          statusEl.style.color = '#ffaa00';
          if (err) console.error('Subscribe Error:', err);
        }
      });

    let lastBroadcastTime = 0;
    function broadcastPosition() {
      const now = Date.now();
      if (now - lastBroadcastTime > 40) { // ~25-30 Updates/Sekunde für flüssige HP/Position
        channel.send({
          type: 'broadcast',
          event: 'player-move',
          payload: player
        });
        lastBroadcastTime = now;
      }
    }

    function tryShooting() {
      const now = Date.now();
      if (now - lastShotTime < FIRE_INTERVAL_MS) return;

      let angle = player.angle;
      if (isShooting) {
        angle = Math.atan2(aimTarget.y - player.y, aimTarget.x - player.x);
        player.angle = angle;
      } else if (!keys.space) {
        return;
      }

      lastShotTime = now;

      const bullet = {
        id: Math.random().toString(36).substr(2, 9),
        shooterId: myId,
        x: player.x + Math.cos(angle) * 25,
        y: player.y + Math.sin(angle) * 25,
        vx: Math.cos(angle) * 12,
        vy: Math.sin(angle) * 12
      };

      bullets.push(bullet);

      channel.send({
        type: 'broadcast',
        event: 'shoot',
        payload: bullet
      });
    }

    // 4. GAME LOOP
    function gameLoop() {
      // WASD Bewegung
      let moveX = 0;
      let moveY = 0;

      if (keys.w) moveY -= 1;
      if (keys.s) moveY += 1;
      if (keys.a) moveX -= 1;
      if (keys.d) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        player.x += (moveX / len) * moveSpeed;
        player.y += (moveY / len) * moveSpeed;
        
        if (!joystick.active && !isShooting) {
          player.angle = Math.atan2(moveY, moveX);
        }
      }

      // Spielfeldbegrenzung
      player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
      player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

      tryShooting();
      broadcastPosition();

      // Rendering
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Joystick-Zone anzeigen
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.fillRect(0, canvas.height - 250, 250, 250);

      // Bullets verarbeiten
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();

        // Hit-Check gegen eigenen Spieler
        if (b.shooterId !== myId) {
          const dist = Math.hypot(b.x - player.x, b.y - player.y);
          if (dist < 25) {
            player.hp -= DAMAGE_PER_HIT;
            bullets.splice(i, 1);
            if (player.hp <= 0) {
              alert('Du wurdest eliminiert!');
              player.hp = MAX_HP;
              player.x = Math.random() * (canvas.width - 100) + 50;
              player.y = Math.random() * (canvas.height - 100) + 50;
            }
            continue;
          }
        }

        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }

      // Spieler zeichnen
      drawPlayer(player);
      Object.values(otherPlayers).forEach(drawPlayer);

      // Joystick zeichnen
      if (joystick.active) {
        drawJoystick();
      }

      requestAnimationFrame(gameLoop);
    }

    function drawPlayer(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, -4, 25, 8);

      ctx.restore();

      // Healthbar (Echtzeit HP Visualisierung)
      const barWidth = 40;
      const currentHp = p.hp !== undefined ? p.hp : MAX_HP;
      ctx.fillStyle = 'red';
      ctx.fillRect(p.x - barWidth/2, p.y - 30, barWidth, 5);
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(p.x - barWidth/2, p.y - 30, Math.max(0, (currentHp / MAX_HP) * barWidth), 5);
    }

    function drawJoystick() {
      ctx.save();
      ctx.beginPath();
      ctx.arc(joystick.startX, joystick.startY, joystick.maxRadius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();

      const dx = joystick.currentX - joystick.startX;
      const dy = joystick.currentY - joystick.startY;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);

      const stickDist = Math.min(dist, joystick.maxRadius);
      const stickX = joystick.startX + Math.cos(angle) * stickDist;
      const stickY = joystick.startY + Math.sin(angle) * stickDist;

      ctx.beginPath();
      ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.fill();
      ctx.restore();
    }

    gameLoop();
  </script>
</body>
</html>
